<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title description">
  <title id="title">FoodProof Fit agentic architecture</title>
  <desc id="description">Three food-package photographs and optional user goals pass through image-quality checks, AI extraction, human confirmation, a bounded LangGraph workflow, and a cited Evidence Card. Barcode verification, fair comparison, live alternatives, session history, refusal paths, and eight evaluation surfaces support the core workflow.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8f6ef"/><stop offset="1" stop-color="#e4efda"/></linearGradient>
    <linearGradient id="agent" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#183229"/><stop offset="1" stop-color="#245b47"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#183229" flood-opacity=".12"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0l12 6-12 6z" fill="#1f684c"/></marker>
    <style>
      .kicker{font:800 18px Arial,sans-serif;letter-spacing:3px;text-transform:uppercase;fill:#1f684c}.title{font:600 56px Georgia,serif;fill:#183229}.sub{font:400 22px Arial,sans-serif;fill:#66746e}.node-kicker{font:800 13px Arial,sans-serif;letter-spacing:1.4px;text-transform:uppercase;fill:#1f684c}.node-title{font:600 24px Georgia,serif;fill:#183229}.body{font:400 16px Arial,sans-serif;fill:#586860}.small{font:700 13px Arial,sans-serif;fill:#456653}.white{fill:#fff}.pale{fill:#d7e2dc}.lime{fill:#d9ef9d}.center{text-anchor:middle}.metric{font:800 26px Arial,sans-serif;fill:#183229}.metric-label{font:700 12px Arial,sans-serif;fill:#586860}.foot{font:600 16px Arial,sans-serif;fill:#66746e}
    </style>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <circle cx="1460" cy="60" r="210" fill="#d9ef9d" opacity=".38"/><circle cx="70" cy="930" r="210" fill="#c8dfca" opacity=".42"/>
  <text x="90" y="82" class="kicker">FoodProof Fit · production-pattern prototype</text>
  <text x="90" y="145" class="title">Evidence before advice.</text>
  <text x="90" y="187" class="sub">AI reads the package. A person confirms it. Bounded tools explain it.</text>

  <g filter="url(#shadow)">
    <rect x="70" y="260" width="230" height="224" rx="26" fill="#fffefa" stroke="#dfe4dc" stroke-width="2"/>
    <text x="98" y="300" class="node-kicker">1 · Inputs</text>
    <text x="98" y="340" class="node-title">Package + context</text>
    <text x="98" y="380" class="body">Front photograph</text><text x="98" y="408" class="body">Nutrition Facts</text><text x="98" y="436" class="body">Ingredients + allergens</text>
    <line x1="98" y1="453" x2="272" y2="453" stroke="#dfe4dc"/>
    <text x="98" y="475" class="small">Portion · goals · barcode</text>

    <rect x="365" y="260" width="230" height="224" rx="26" fill="#fffefa" stroke="#dfe4dc" stroke-width="2"/>
    <text x="393" y="300" class="node-kicker">2 · Perception</text>
    <text x="393" y="340" class="node-title">Read with doubt</text>
    <text x="393" y="380" class="body">Blur / glare / crop gate</text><text x="393" y="408" class="body">Vision-to-JSON extraction</text><text x="393" y="436" class="body">Missing-field tracking</text>
    <line x1="393" y1="453" x2="567" y2="453" stroke="#dfe4dc"/>
    <text x="393" y="475" class="small">Weak evidence → RETAKE</text>

    <rect x="660" y="260" width="230" height="224" rx="26" fill="#edf6db" stroke="#1f684c" stroke-width="3"/>
    <text x="688" y="300" class="node-kicker">3 · Human gate</text>
    <text x="688" y="340" class="node-title">Confirm or correct</text>
    <text x="688" y="380" class="body">Review extracted values</text><text x="688" y="408" class="body">Fix AI mistakes</text><text x="688" y="436" class="body">Approve serving + portion</text>
    <line x1="688" y1="453" x2="862" y2="453" stroke="#cbdcb9"/>
    <text x="688" y="475" class="small">No calculation before approval</text>

    <rect x="955" y="230" width="310" height="284" rx="30" fill="url(#agent)"/>
    <text x="985" y="273" class="node-kicker lime">4 · LangGraph workflow</text>
    <text x="985" y="316" class="node-title white">Route the evidence</text>
    <text x="985" y="354" class="body pale">Safety and intent gate</text><text x="985" y="382" class="body pale">Exact portion calculation</text><text x="985" y="410" class="body pale">Allergen + goal matching</text><text x="985" y="438" class="body pale">FDA retrieval + claim check</text><text x="985" y="466" class="body pale">Barcode delta-check</text>
    <line x1="985" y1="481" x2="1235" y2="481" stroke="#6c9181"/>
    <text x="985" y="503" class="small lime">Unsupported or unsafe → REFUSE</text>

    <rect x="1330" y="260" width="200" height="224" rx="26" fill="#d9ef9d" stroke="#1f684c" stroke-width="2"/>
    <text x="1358" y="300" class="node-kicker">5 · Output</text>
    <text x="1358" y="340" class="node-title">Evidence Card</text>
    <text x="1358" y="380" class="body">Confirmed facts</text><text x="1358" y="408" class="body">Citations + limits</text><text x="1358" y="436" class="body">Alerts or refusal</text>
    <line x1="1358" y1="453" x2="1502" y2="453" stroke="#b7d18f"/>
    <text x="1358" y="475" class="small">Never a health verdict</text>
  </g>

  <path d="M300 372H350" stroke="#1f684c" stroke-width="4" marker-end="url(#arrow)"/><path d="M595 372H645" stroke="#1f684c" stroke-width="4" marker-end="url(#arrow)"/><path d="M890 372H940" stroke="#1f684c" stroke-width="4" marker-end="url(#arrow)"/><path d="M1265 372H1315" stroke="#1f684c" stroke-width="4" marker-end="url(#arrow)"/>

  <text x="800" y="576" class="node-kicker center">Useful extensions built around the same confirmed evidence</text>
  <g filter="url(#shadow)">
    <rect x="70" y="605" width="320" height="112" rx="22" fill="#fffefa" stroke="#dfe4dc"/>
    <circle cx="110" cy="661" r="25" fill="#edf6db"/><text x="110" y="668" text-anchor="middle" class="small">01</text>
    <text x="150" y="646" class="node-title">Barcode check</text><text x="150" y="674" class="body">Historical record; package wins</text><text x="150" y="699" class="small">≥20% difference → review</text>

    <rect x="450" y="605" width="320" height="112" rx="22" fill="#fffefa" stroke="#dfe4dc"/>
    <circle cx="490" cy="661" r="25" fill="#edf6db"/><text x="490" y="668" text-anchor="middle" class="small">02</text>
    <text x="530" y="646" class="node-title">Fair comparison</text><text x="530" y="674" class="body">Serving · portion · per 100 g</text><text x="530" y="699" class="small">No “healthier” verdict</text>

    <rect x="830" y="605" width="320" height="112" rx="22" fill="#fffefa" stroke="#dfe4dc"/>
    <circle cx="870" cy="661" r="25" fill="#edf6db"/><text x="870" y="668" text-anchor="middle" class="small">03</text>
    <text x="910" y="646" class="node-title">Live alternatives</text><text x="910" y="674" class="body">Same-category nutrient priority</text><text x="910" y="699" class="small">Evidence gaps → safe stop</text>

    <rect x="1210" y="605" width="320" height="112" rx="22" fill="#fffefa" stroke="#dfe4dc"/>
    <circle cx="1250" cy="661" r="25" fill="#edf6db"/><text x="1250" y="668" text-anchor="middle" class="small">04</text>
    <text x="1290" y="646" class="node-title">Session history</text><text x="1290" y="674" class="body">Reopen confirmed results</text><text x="1290" y="699" class="small">No photos or profile stored</text>
  </g>

  <rect x="90" y="775" width="1420" height="140" rx="26" fill="#fffefa" stroke="#dfe4dc" stroke-width="2"/>
  <text x="122" y="812" class="node-kicker">Release evidence · eight risks stay separate</text>
  <g class="center">
    <text x="160" y="858" class="metric">16/16</text><text x="160" y="881" class="metric-label">unsafe refusals</text>
    <text x="340" y="858" class="metric">10/10</text><text x="340" y="881" class="metric-label">safe requests</text>
    <text x="520" y="858" class="metric">6/6</text><text x="520" y="881" class="metric-label">calculations</text>
    <text x="700" y="858" class="metric">4/4</text><text x="700" y="881" class="metric-label">FDA retrieval</text>
    <text x="880" y="858" class="metric">6/6</text><text x="880" y="881" class="metric-label">personalization</text>
    <text x="1060" y="858" class="metric">3/3</text><text x="1060" y="881" class="metric-label">comparison</text>
    <text x="1240" y="858" class="metric">2/2</text><text x="1240" y="881" class="metric-label">barcode rules</text>
    <text x="1420" y="858" class="metric">5/5</text><text x="1420" y="881" class="metric-label">alternatives</text>
  </g>
  <text x="800" y="962" text-anchor="middle" class="foot">52/52 defined golden cases passed · 4 real photographed products completed · 1 weak-image set correctly requested a retake</text>
</svg>
